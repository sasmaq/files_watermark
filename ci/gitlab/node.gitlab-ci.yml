# Frontend jobs - the GitLab equivalent of .github/workflows/nodejs.yml.

.node:
  stage: check
  # Nothing frontend depends on the PHP image, so these start at once instead of behind
  # the `images` stage.
  needs: []
  variables:
    NODE_VERSION: "20"
  image: node:$NODE_VERSION-bookworm
  before_script:
    - npm ci
  cache:
    # The npm cache is version-independent - it stores tarballs, not built artifacts -
    # so Node 20 and 22 share one, which is also what makes the second Jest leg cheap.
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - .npm-cache/

node:lint:
  extends: .node
  script:
    - npm run lint

node:jest:
  extends: .node
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  script:
    - npm test

# The job that matters beyond the suites: `js/` is committed, so a build that fails in CI
# while the checked-in bundle still works is the drift this catches.
node:build:
  extends: .node
  stage: test
  script:
    - npm run build
  artifacts:
    # Not a release artifact - it is what lets you diff CI's bundle against the committed
    # one when they disagree.
    expire_in: 1 day
    paths:
      - js/
      - css/
