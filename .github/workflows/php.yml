name: PHP

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: php-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]

    name: Syntax (PHP ${{ matrix.php-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # `php -l` needs no dependencies, so this job skips composer install entirely
      # and stays the first signal on a pull request.
      - name: Lint
        run: composer lint

  coding-standard:
    runs-on: ubuntu-latest

    # The Nextcloud coding standard is version-independent, so one PHP version is
    # enough - unlike the syntax job, which is what catches version-specific parse
    # errors. Pinned to the lowest supported version to share the composer cache
    # with the 8.2 PHPUnit job below.
    name: Coding standard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.2-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check coding standard
        run: composer cs:check

  psalm:
    runs-on: ubuntu-latest

    # One version is enough: psalm.xml pins `phpVersion="8.2"`, so the analysis is
    # identical on 8.3 and the second leg would only re-prove that. The matrix that
    # matters for version-specific behaviour is the syntax job above.
    name: Static analysis (Psalm)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          # Same extensions as the PHPUnit job. Psalm reflects extension classes from
          # the *running* PHP, so loading imagick here is what gets the optional Imagick
          # branch of ImageWatermarker analysed at all - psalm.xml suppresses the
          # undefined-class noise it would otherwise produce on a host without the
          # extension. CI is therefore the stricter of the two, never the looser.
          extensions: gd, imagick, gmp, mbstring, dom, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.2-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Psalm
        run: composer psalm

  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]

    name: PHPUnit (PHP ${{ matrix.php-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # Extensions used by the watermarking renderers and the test suite.
          extensions: gd, imagick, gmp, mbstring, dom, zip
          coverage: none
          ini-values: memory_limit=512M

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
