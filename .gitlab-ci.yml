# GitLab CI - the same suites as .github/workflows/{php,nodejs,e2e}.yml, in one file.
#
# It is deliberately a plain translation of those three workflows: same jobs, same
# matrices, same commands. If the two ever disagree, the GitHub workflows are the ones
# that run on every push and are therefore the ones to trust.
#
# **Nothing here builds a container image.** The PHP jobs run on the stock `php:<v>-cli`
# images and add the extension set in `before_script`, which is what
# `shivammathur/setup-php` does for the GitHub jobs. That costs about a minute per job
# and needs no container registry, no privileged runner and no image-build stage - the
# things that made this config something you had to set up before you could use it.
# `ci/php.Dockerfile` stays for the Jenkinsfile, which builds it per stage.
#
# The GitHub triggers (push to main, pull_request) map to the `workflow:` rules below:
# merge-request pipelines and default-branch pipelines, never both for the same commit.
# Without that pairing GitLab runs a branch pipeline *and* an MR pipeline for every push
# to a branch with an open MR, which doubles the bill and halves the runner capacity.

stages:
  - check
  - test
  - e2e

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  # Mirrors `concurrency: cancel-in-progress: true`. Every job below is
  # `interruptible`, so a new push to the same ref cancels the run still going.
  # Requires GitLab 16.8 or newer; on anything older it is ignored and the old
  # pipeline simply runs to completion.
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  # A runner that dies mid-job is not a test failure. Nothing here is order-dependent
  # or leaves state behind - the E2E job cleans up in `after_script` - so a retry is
  # always safe.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  # Caches live in the workspace because that is what GitLab's `cache:` can carry
  # between jobs; both paths are already gitignored for the Jenkins agents.
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer-cache
  npm_config_cache: $CI_PROJECT_DIR/.npm-cache
  COMPOSER_NO_INTERACTION: "1"
  GIT_DEPTH: "20"

# ---------------------------------------------------------------------------
# PHP - .github/workflows/php.yml
# ---------------------------------------------------------------------------

.php:
  stage: check
  image: php:$PHP_VERSION-cli
  variables:
    PHP_VERSION: "8.2"
    # The extensions the watermarking renderers and the test suite use, matching the
    # GitHub jobs and ci/php.Dockerfile. `bcmath` is not optional anywhere: it is a
    # `require` in composer.json, so `composer install` refuses to resolve without it.
    PHP_EXTENSIONS: "gd imagick gmp mbstring dom zip bcmath @composer"
  before_script:
    # The same installer ci/php.Dockerfile copies in, fetched at job time instead.
    - curl -sSLf -o /usr/local/bin/install-php-extensions
      https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions $PHP_EXTENSIONS
    # git and unzip are what `composer install --prefer-dist` needs. Nothing else: the
    # app spawns no processes, so no test depends on an external binary.
    - apt-get update && apt-get install -y --no-install-recommends git unzip && rm -rf /var/lib/apt/lists/*
    - echo 'memory_limit=512M' > /usr/local/etc/php/conf.d/zz-ci.ini
  cache:
    # Keyed on the lockfile *and* the PHP version: `composer install` resolves against
    # the running platform, so one cache shared across versions would hand 8.3 what 8.2
    # resolved.
    key:
      files:
        - composer.lock
      prefix: composer-$PHP_VERSION
    paths:
      - .composer-cache/

# `php -l` needs no dependencies and no extensions, so this job installs neither and
# stays the first signal on a merge request. Both supported versions, because a parse
# error is the thing that is version-specific.
php:lint:
  extends: .php
  variables:
    PHP_EXTENSIONS: "@composer"
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3"]
  script:
    - composer lint

# The Nextcloud coding standard is version-independent, so one PHP version is enough -
# unlike the syntax job, which is what catches version-specific parse errors. Pinned to
# the lowest supported version to share the composer cache with the 8.2 PHPUnit job.
php:cs:
  extends: .php
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - composer cs:check

# One version is enough: psalm.xml pins `phpVersion="8.2"`, so an 8.3 leg would only
# re-prove the same analysis. What it does need is the full extension set - Psalm
# reflects extension classes from the *running* PHP, so imagick being present is what
# gets the optional Imagick branch of ImageWatermarker analysed at all.
php:psalm:
  extends: .php
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - composer psalm

php:phpunit:
  extends: .php
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3"]
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - vendor/bin/phpunit --colors=always --log-junit build/phpunit-$PHP_VERSION.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/phpunit-$PHP_VERSION.xml

# ---------------------------------------------------------------------------
# Frontend - .github/workflows/nodejs.yml
# ---------------------------------------------------------------------------

.node:
  stage: check
  image: node:$NODE_VERSION-bookworm
  variables:
    NODE_VERSION: "20"
  before_script:
    - npm ci
  cache:
    # The npm cache is version-independent - it stores tarballs, not built artifacts -
    # so Node 20 and 22 share one, which is also what makes the second Jest leg cheap.
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - .npm-cache/

node:lint:
  extends: .node
  script:
    - npm run lint

node:jest:
  extends: .node
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  script:
    - npm test

# The job that matters beyond the suites: `js/` is committed, so a build that fails in CI
# while the checked-in bundle still works is the drift this catches.
node:build:
  extends: .node
  stage: test
  script:
    - npm run build
  artifacts:
    # Not a release artifact - it is what lets you diff CI's bundle against the committed
    # one when they disagree.
    expire_in: 1 day
    paths:
      - js/
      - css/

# ---------------------------------------------------------------------------
# E2E - .github/workflows/e2e.yml
# ---------------------------------------------------------------------------
#
# **This one cannot run in a container.** It brings up `docker-compose.yml`, which
# bind-mounts the checkout into Nextcloud's `custom_apps/`; a bind mount issued from
# inside a container job (including one talking to docker:dind) resolves against the
# *daemon's* filesystem, not the job's, so the mount silently lands on the wrong - or an
# empty - directory and every spec fails on a missing app. The Jenkinsfile runs its E2E
# stage on the agent itself for exactly this reason.
#
# So it needs a **shell runner** on a host with `php`, `composer`, `node`, `npm` and
# `docker compose` on PATH, and port 8080 free while it runs.
#
# It is therefore opt-in: set the CI/CD variable `E2E_RUNNER_TAG` to that runner's tag
# and the job appears. Left unset - the default, and the only sane one on shared runners
# - the job does not exist, rather than sitting pending forever waiting for a runner that
# will never pick it up.

e2e:cypress:
  stage: e2e
  tags:
    - $E2E_RUNNER_TAG
  rules:
    - if: $E2E_RUNNER_TAG == null || $E2E_RUNNER_TAG == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # One instance per host: the compose file publishes a fixed port 8080, and two runs
  # sharing a shell runner would fight over it and over the container names.
  resource_group: e2e
  timeout: 30 minutes
  script:
    # The container runs the *compiled* app off the bind mount, so both builds have to
    # happen here before Nextcloud starts. `--no-dev` is not just for speed: the dev tree
    # is what shadowed core's Sabre once, and CI should install what a release installs.
    - composer install --no-dev --prefer-dist --no-progress --no-interaction
    - npm ci
    - npm run build
    - docker compose up -d
    # GitLab runs the whole script in one shell, so the wait loop uses `break` and a
    # flag. An `exit 0` here - which is what the GitHub step uses, where it ends only
    # that step - would end the *job* as a success without ever running a spec.
    - |
      installed=false
      for attempt in $(seq 1 60); do
        if curl -sf http://localhost:8080/status.php | grep -q '"installed":true'; then
          installed=true
          break
        fi
        sleep 5
      done
      if [ "$installed" != "true" ]; then
        echo "Nextcloud did not finish installing"
        docker compose logs --tail=100
        exit 1
      fi
    - docker compose exec -T -u www-data nextcloud php occ app:enable files_watermark
    # Core allows 20 shares per 10 minutes per user, and this suite rebuilds its
    # fixtures - users, folders, shares - on every run, which legitimately looks like
    # abuse. Two runs inside the window exhaust the budget and the share specs fail in
    # their setup with an empty 429. Off on a throwaway test instance only.
    - >
      docker compose exec -T -u www-data nextcloud php occ config:system:set
      ratelimit.protection.enabled --value false --type boolean
    - npm run test:e2e
  after_script:
    # The instance's own log is the only account of a server-side failure, and the
    # containers go either way - a leftover stack would block the next run's port 8080.
    - if [ "$CI_JOB_STATUS" != "success" ]; then docker compose exec -T nextcloud tail -n 200 /var/www/html/data/nextcloud.log || true; fi
    - docker compose down -v || true
  artifacts:
    # Screenshots are only written for failures, and they are the only record of what a
    # UI spec saw.
    when: on_failure
    expire_in: 1 week
    paths:
      - cypress/screenshots/
